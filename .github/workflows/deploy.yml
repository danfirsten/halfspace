name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [claude/fable-opus-orchestration-76crd8, main]
    paths: [web/**, .github/workflows/deploy.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if web app not present yet
        id: gate
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        if: steps.gate.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.present == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.present == 'true'
        with:
          path: web/dist
      - name: Deploy
        if: steps.gate.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
